<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automotora - Catálogo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: #f8f9fa; color: #333; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: #fff; border-bottom: 1px solid #eee; }
        .logo { font-weight: bold; font-size: 1.2rem; }
        nav a { margin-left: 1rem; text-decoration: none; color: #555; }
        .hero { text-align: center; padding: 4rem 1rem; background: #fff; margin-bottom: 2rem; }
        .hero h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
        .hero p { color: #666; margin-bottom: 1.5rem; }
        .btn { display: inline-block; background: #000; color: #fff; padding: 0.75rem 1.5rem; border-radius: 6px; text-decoration: none; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; max-width: 1100px; margin: 0 auto; padding: 0 1rem; margin-bottom: 3rem; }
        .card { background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #eee; }
        .card img { width: 100%; height: 250px; object-fit: cover; background: #eaeaea; }
        .card-body { padding: 1.2rem; }
        .badge { display: inline-block; background: #eee; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.8rem; margin-bottom: 0.5rem;}
        .price { font-size: 1.5rem; font-weight: bold; color: #111; margin: 0.5rem 0; }
        .loading { text-align: center; padding: 2rem; color: #666; grid-column: 1 / -1; }
    </style>
</head>
<body>
    <header>
        <div class="logo">TU AUTOMOTORA</div>
        <nav>
            <a href="#">Inicio</a>
            <a href="#">Stock</a>
        </nav>
    </header>
    
    <section class="hero">
        <h1>Tu próximo auto lo encuentras acá</h1>
        <p>Catálogo actualizado en tiempo real.</p>
    </section>

    <main class="grid" id="catalogo">
        <div class="loading">Cargando vehículos...</div>
    </main>

    <script>
        // 1. PEGA AQUÍ TU ENLACE CSV DE GOOGLE SHEETS
        const urlGoogleSheet = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSoyaqfVzpHqZcc7bGS9zjS-ROjubr2PClpRQLB3qVKTlaYSdyvEfSTaRV9GXRaMyo4APnw2mSHmsFN/pub?output=csv";

        function cargarAutos() {
            Papa.parse(urlGoogleSheet, {
                download: true,
                header: true,
                complete: function(results) {
                    const datos = results.data;
                    const contenedor = document.getElementById('catalogo');
                    contenedor.innerHTML = ''; 

                    datos.forEach(auto => {
                        // Verifica que la fila tenga al menos la marca y el precio
                        if(auto["Marca/Modelo"] && auto["Precio (CLP)"]) {
                            
                            // Truco para convertir el enlace de Drive en una imagen visible
                            let urlImagen = "https://via.placeholder.com/400x250?text=Sin+Imagen";
                            const fotoDrive = auto["Foto 1"];
                            
                            if (fotoDrive) {
                                // Esta fórmula extrae el ID oculto del enlace de Drive
                                const match = fotoDrive.match(/[-\w]{25,}/);
                                if (match) {
                                    urlImagen = `https://drive.google.com/uc?export=view&id=${match[0]}`;
                                }
                            }

                            const tarjeta = document.createElement('div');
                            tarjeta.className = 'card';
                            
                            // Se construye la tarjeta usando los nombres EXACTOS de tus columnas
                            tarjeta.innerHTML = `
                                <img src="${urlImagen}" alt="${auto["Marca/Modelo"]}">
                                <div class="card-body">
                                    <span class="badge">${auto["Año"]}</span>
                                    <span class="badge">${auto["Transmisión"]}</span>
                                    <span class="badge">${auto["Bencina/Diesel"]}</span>
                                    
                                    <h3 style="margin-top: 0.5rem;">${auto["Marca/Modelo"]}</h3>
                                    <p style="color: #666; font-size: 0.9rem; margin-top: 0.3rem;">${auto["Descripción"]} • ${auto["Kilometraje ($)"]} km</p>
                                    
                                    <div class="price">$${auto["Precio (CLP)"]}</div>
                                    
                                    <a href="https://wa.me/56912345678?text=Hola, me interesa el ${auto["Marca/Modelo"]}" class="btn" style="margin-top: 1rem; display: block; text-align: center; font-size: 0.95rem;">Me interesa</a>
                                </div>
                            `;
                            contenedor.appendChild(tarjeta);
                        }
                    });
                }
            });
        }

        cargarAutos();
    </script>
</body>
</html>
