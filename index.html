<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AG Select Automotora - Catálogo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: #f8f9fa; color: #333; }
        
        /* --- CABECERA Y LOGO --- */
        header { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 2rem; background: #fff; border-bottom: 1px solid #eee; }
        .logo img { max-height: 225px; width: auto; object-fit: contain; display: block; }
        nav a { margin-left: 1rem; text-decoration: none; color: #555; font-weight: 500; }
        
        /* --- SECCIÓN PRINCIPAL (HERO) --- */
        .hero { text-align: center; padding: 2.5rem 1rem; background: #fff; margin-bottom: 1.5rem; }
        .hero h1 { font-size: 2rem; margin-bottom: 0.8rem; }
        .hero-desc { color: #555; font-size: 1rem; line-height: 1.6; max-width: 600px; margin: 0 auto 1.5rem auto; }
        
        .btn { display: inline-block; background: #000; color: #fff; padding: 0.75rem 1.5rem; border-radius: 6px; text-decoration: none; font-weight: bold; }
        .btn-disabled { background: #888 !important; color: #fff !important; cursor: not-allowed; pointer-events: none; }
        
        .btn-ig { 
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; 
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); 
            color: #fff; padding: 0.75rem 1.5rem; border-radius: 6px; text-decoration: none; font-weight: bold; transition: opacity 0.3s;
        }
        .btn-ig:hover { opacity: 0.9; }

        /* --- CONTROLES DE FILTRO Y ORDEN --- */
        .filtros-wrapper { max-width: 1100px; margin: 0 auto 1.5rem auto; padding: 0 1rem; }
        .filtros-card { background: #fff; padding: 1.2rem; border-radius: 8px; border: 1px solid #eee; display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between; }
        .filtro-grupo { display: flex; flex-wrap: wrap; gap: 0.8rem; flex-grow: 1; }
        .filtro-control { flex: 1; min-width: 130px; }
        .filtro-control label { display: block; font-size: 0.8rem; font-weight: bold; color: #666; margin-bottom: 0.3rem; text-transform: uppercase; }
        .filtro-control input, .filtro-control select { 
            width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; background: #fff; outline: none;
        }
        .filtro-control input:focus, .filtro-control select:focus { border-color: #000; }

        /* --- GRILLA Y TARJETAS --- */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; max-width: 1100px; margin: 0 auto; padding: 0 1rem; margin-bottom: 3rem; }
        .card { background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #eee; display: flex; flex-direction: column; }
        
        /* --- ESTILOS DEL CARRUSEL Y INSIGNIA VENDIDO --- */
        .carousel { position: relative; width: 100%; height: 250px; background: #eaeaea; cursor: pointer; overflow: hidden; touch-action: pan-y; }
        .carousel img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; user-select: none; }
        .carousel:hover img { transform: scale(1.03); } 
        
        .banner-vendido {
            position: absolute; top: 12px; left: 12px;
            background: #dc2743; color: #ffffff; padding: 6px 14px;
            border-radius: 4px; font-weight: bold; font-size: 0.85rem;
            text-transform: uppercase; z-index: 3; letter-spacing: 1px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .carousel-btn { 
            position: absolute; top: 50%; transform: translateY(-50%); 
            background: rgba(0,0,0,0.6); color: white; border: none; 
            padding: 0.8rem 0.5rem; cursor: pointer; opacity: 0; 
            transition: opacity 0.3s; font-size: 1.2rem; z-index: 2; border-radius: 4px;
        }
        .carousel:hover .carousel-btn { opacity: 1; } 
        .carousel-btn:hover { background: rgba(0,0,0,0.9); }
        .prev-btn { left: 5px; }
        .next-btn { right: 5px; }
        .contador-fotos { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.6); color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; z-index: 2; pointer-events: none;}

        .card-body { padding: 1.2rem; flex-grow: 1; display: flex; flex-direction: column; }
        .badge { display: inline-block; background: #eee; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.8rem; margin-bottom: 0.5rem; margin-right: 0.2rem;}
        .price { font-size: 1.5rem; font-weight: bold; color: #111; margin: 0.5rem 0; }
        .loading { text-align: center; padding: 3rem; color: #666; grid-column: 1 / -1; font-size: 1.1rem; }
        
        /* --- ESTILOS DEL LIGHTBOX --- */
        .lightbox { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); display: none; justify-content: center; 
            align-items: center; flex-direction: column; z-index: 1000; padding: 1rem;
            touch-action: pan-y;
        }
        .lightbox-content { position: relative; width: 100%; height: 85vh; display: flex; justify-content: center; align-items: center; }
        .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; box-shadow: 0 5px 25px rgba(0,0,0,0.5); user-select: none; }
        .close-lightbox { position: absolute; top: 15px; right: 25px; color: white; font-size: 3rem; cursor: pointer; font-weight: bold; z-index: 1001; }
        .close-lightbox:hover { color: #ccc; }
        
        .lightbox-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255,255,255,0.1); color: white; border: none;
            padding: 1rem 1.5rem; cursor: pointer; font-size: 2rem; z-index: 1001; border-radius: 8px; transition: background 0.3s;
        }
        .lightbox-btn:hover { background: rgba(255,255,255,0.3); }
        .lb-prev { left: 10px; }
        .lb-next { right: 10px; }
        .lb-counter { color: white; margin-top: 15px; font-size: 1.2rem; }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <img src="https://drive.google.com/thumbnail?id=1ijRH919dI3BznZ6R9YhH22RnBm5srQ-7&sz=w1000" alt="AG Select Automotora">
        </div>
        <nav>
            <a href="#">Inicio</a>
            <a href="#">Stock</a>
        </nav>
    </header>
    
    <section class="hero">
        <h1>Tu próximo auto lo encuentras acá</h1>
        <div class="hero-desc">
            <p>Compra - vende o consigna con nosotros de forma segura! 🚘</p>
            <p>Te asesoramos en todo el proceso.</p>
            <p>Servicio de Carhunter - encontramos tu próximo auto. 🔍</p>
        </div>
        <a href="https://www.instagram.com/agselect_automotora?utm_source=ig_web_button_share_sheet&igsi=ZDNlZDc0MzIxNw==" target="_blank" class="btn-ig">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
            Síguenos en Instagram
        </a>
    </section>

    <!-- PANEL DE FILTROS Y ORDENAMIENTO -->
    <div class="filtros-wrapper">
        <div class="filtros-card">
            <div class="filtro-grupo">
                <div class="filtro-control">
                    <label for="buscarMarca">Buscar</label>
                    <input type="text" id="buscarMarca" placeholder="Ej: Mercedes, Peugeot..." oninput="filtrarYOrdenar()">
                </div>
                <div class="filtro-control">
                    <label for="precioMin">Precio Mín ($)</label>
                    <input type="number" id="precioMin" placeholder="Ej: 5000000" oninput="filtrarYOrdenar()">
                </div>
                <div class="filtro-control">
                    <label for="precioMax">Precio Máx ($)</label>
                    <input type="number" id="precioMax" placeholder="Ej: 20000000" oninput="filtrarYOrdenar()">
                </div>
                <div class="filtro-control">
                    <label for="filtroEstado">Estado</label>
                    <select id="filtroEstado" onchange="filtrarYOrdenar()">
                        <option value="todos">Todos</option>
                        <option value="disponible">Disponible</option>
                        <option value="vendido">Vendido</option>
                    </select>
                </div>
                <div class="filtro-control">
                    <label for="filtroTransmision">Transmisión</label>
                    <select id="filtroTransmision" onchange="filtrarYOrdenar()">
                        <option value="todos">Todas</option>
                        <option value="automatica">Automática</option>
                        <option value="mecanica">Mecánica</option>
                    </select>
                </div>
                <div class="filtro-control">
                    <label for="filtroCombustible">Combustible</label>
                    <select id="filtroCombustible" onchange="filtrarYOrdenar()">
                        <option value="todos">Todos</option>
                    </select>
                </div>
            </div>
            
            <div class="filtro-control" style="min-width: 170px;">
                <label for="ordenarPor">Ordenar por</label>
                <select id="ordenarPor" onchange="filtrarYOrdenar()">
                    <option value="defecto">Destacados</option>
                    <option value="precio-asc">Precio: Menor a Mayor</option>
                    <option value="precio-desc">Precio: Mayor a Menor</option>
                    <option value="km-asc">Kilometraje: Menor a Mayor</option>
                    <option value="km-desc">Kilometraje: Mayor a Menor</option>
                    <option value="ano-desc">Año: Más reciente</option>
                </select>
            </div>
        </div>
    </div>

    <main class="grid" id="catalogo">
        <div class="loading">Cargando catálogo de vehículos...</div>
    </main>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" onclick="cerrarLightbox()">
        <span class="close-lightbox" onclick="cerrarLightbox()">&times;</span>
        <div class="lightbox-content">
            <button id="btn-lb-prev" class="lightbox-btn lb-prev" onclick="cambiarFotoLightbox(event, -1)">&#10094;</button>
            <img id="lightbox-img" src="" alt="Vehículo ampliado" onclick="event.stopPropagation()">
            <button id="btn-lb-next" class="lightbox-btn lb-next" onclick="cambiarFotoLightbox(event, 1)">&#10095;</button>
        </div>
        <div id="lightbox-counter" class="lb-counter"></div>
    </div>

    <script>
        const urlGoogleSheet = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSoyaqfVzpHqZcc7bGS9zjS-ROjubr2PClpRQLB3qVKTlaYSdyvEfSTaRV9GXRaMyo4APnw2mSHmsFN/pub?output=csv";

        window.todosLosAutos = [];
        window.galeriasAutos = {}; 
        window.indicesAutos = {};
        window.autoActualLightbox = null; 

        function parseNumero(val) {
            if (!val) return 0;
            return parseInt(val.toString().replace(/\D/g, '')) || 0;
        }

        // Determina si el auto está marcado como Vendido en Google Sheets
        function esAutoVendido(auto) {
            const rawEstado = (
                auto["Estado"] || 
                auto["Disponibilidad"] || 
                auto["Disponible"] || 
                auto["Estado/Disponibilidad"] || 
                ""
            ).toLowerCase().trim();
            
            return rawEstado.includes("vendido") || rawEstado.includes("no disponible") || rawEstado === "no";
        }

        window.cambiarFoto = function(event, autoId, direccion) {
            if (event && event.stopPropagation) event.stopPropagation(); 
            let fotos = window.galeriasAutos[autoId];
            let indexActual = window.indicesAutos[autoId] + direccion;
            if (indexActual >= fotos.length) indexActual = 0;
            if (indexActual < 0) indexActual = fotos.length - 1;
            
            window.indicesAutos[autoId] = indexActual;
            document.getElementById(`img-${autoId}`).src = fotos[indexActual];
            document.getElementById(`contador-${autoId}`).innerText = `${indexActual + 1}/${fotos.length}`;
        };

        window.abrirLightbox = function(autoId) {
            let cEl = document.getElementById(`carousel-${autoId}`);
            if (cEl && cEl.dataset.swiped === "true") {
                cEl.dataset.swiped = "false";
                return;
            }
            window.autoActualLightbox = autoId;
            actualizarVistaLightbox();
            document.getElementById('lightbox').style.display = 'flex';
        };

        window.cerrarLightbox = function() {
            document.getElementById('lightbox').style.display = 'none';
        };

        window.cambiarFotoLightbox = function(event, direccion) {
            if (event && event.stopPropagation) event.stopPropagation();
            let autoId = window.autoActualLightbox;
            let fotos = window.galeriasAutos[autoId];
            let indexActual = window.indicesAutos[autoId] + direccion;
            if (indexActual >= fotos.length) indexActual = 0;
            if (indexActual < 0) indexActual = fotos.length - 1;
            
            window.indicesAutos[autoId] = indexActual;
            document.getElementById(`img-${autoId}`).src = fotos[indexActual];
            let contadorTarjeta = document.getElementById(`contador-${autoId}`);
            if(contadorTarjeta) contadorTarjeta.innerText = `${indexActual + 1}/${fotos.length}`;
            
            actualizarVistaLightbox();
        };

        window.actualizarVistaLightbox = function() {
            let autoId = window.autoActualLightbox;
            let indexActual = window.indicesAutos[autoId];
            let fotos = window.galeriasAutos[autoId];
            
            document.getElementById('lightbox-img').src = fotos[indexActual];
            document.getElementById('lightbox-counter').innerText = `${indexActual + 1} / ${fotos.length}`;
            
            let displayFlechas = fotos.length > 1 ? 'block' : 'none';
            document.getElementById('btn-lb-prev').style.display = displayFlechas;
            document.getElementById('btn-lb-next').style.display = displayFlechas;
        };

        let lbTouchStartX = 0;
        const lbElement = document.getElementById('lightbox');
        lbElement.addEventListener('touchstart', function(e) { lbTouchStartX = e.changedTouches[0].clientX; }, {passive: true});
        lbElement.addEventListener('touchend', function(e) {
            let diff = e.changedTouches[0].clientX - lbTouchStartX;
            if (Math.abs(diff) > 40) {
                if (diff < 0) cambiarFotoLightbox(e, 1);
                else cambiarFotoLightbox(e, -1);
            }
        }, {passive: true});

        function llenarDesplegables(datos) {
            const combSet = new Set();
            datos.forEach(auto => {
                if (auto["Bencina/Diesel"] && auto["Bencina/Diesel"].trim() !== "") combSet.add(auto["Bencina/Diesel"].trim());
            });

            const selComb = document.getElementById('filtroCombustible');
            selComb.innerHTML = '<option value="todos">Todos</option>';
            combSet.forEach(c => { selComb.innerHTML += `<option value="${c}">${c}</option>`; });
        }

        function filtrarYOrdenar() {
            const textoBusqueda = document.getElementById('buscarMarca').value.toLowerCase().trim();
            const pMinVal = document.getElementById('precioMin').value;
            const pMaxVal = document.getElementById('precioMax').value;
            const pMin = pMinVal ? parseNumero(pMinVal) : 0;
            const pMax = pMaxVal ? parseNumero(pMaxVal) : Infinity;

            const estadoSel = document.getElementById('filtroEstado').value;
            const transSel = document.getElementById('filtroTransmision').value;
            const combSel = document.getElementById('filtroCombustible').value;
            const ordenSel = document.getElementById('ordenarPor').value;

            // 1. Filtrar
            let resultado = window.todosLosAutos.filter(auto => {
                const modeloMarca = (auto["Marca/Modelo"] || "").toLowerCase();
                const desc = (auto["Descripción"] || "").toLowerCase();
                const coincideTexto = modeloMarca.includes(textoBusqueda) || desc.includes(textoBusqueda);
                
                // Filtro de Precio
                const precioVal = parseNumero(auto["Precio (CLP)"]);
                const coincidePrecio = precioVal >= pMin && (pMax === Infinity || precioVal <= pMax);

                // Filtro Estado (Disponible / Vendido)
                const vendido = esAutoVendido(auto);
                let coincideEstado = true;
                if (estadoSel === 'disponible') coincideEstado = !vendido;
                else if (estadoSel === 'vendido') coincideEstado = vendido;

                // Transmisión
                const rawTrans = (auto["Transmisión"] || "").toLowerCase();
                let coincideTrans = true;
                if (transSel === 'automatica') {
                    coincideTrans = rawTrans.includes('auto') || rawTrans.includes('aut');
                } else if (transSel === 'mecanica') {
                    coincideTrans = rawTrans.includes('mec') || rawTrans.includes('man');
                }

                // Combustible
                const coincideComb = (combSel === 'todos') || (auto["Bencina/Diesel"] && auto["Bencina/Diesel"].trim() === combSel);

                return coincideTexto && coincidePrecio && coincideEstado && coincideTrans && coincideComb;
            });

            // 2. Ordenar
            resultado.sort((a, b) => {
                const precioA = parseNumero(a["Precio (CLP)"]);
                const precioB = parseNumero(b["Precio (CLP)"]);
                const kmA = parseNumero(a["Kilometraje ($)"]);
                const kmB = parseNumero(b["Kilometraje ($)"]);
                const anoA = parseNumero(a["Año"]);
                const anoB = parseNumero(b["Año"]);

                if (ordenSel === 'precio-asc') return precioA - precioB;
                if (ordenSel === 'precio-desc') return precioB - precioA;
                if (ordenSel === 'km-asc') return kmA - kmB;
                if (ordenSel === 'km-desc') return kmB - kmA;
                if (ordenSel === 'ano-desc') return anoB - anoA;
                return 0;
            });

            renderizarAutos(resultado);
        }

        function renderizarAutos(autos) {
            const contenedor = document.getElementById('catalogo');
            contenedor.innerHTML = ''; 

            if (autos.length === 0) {
                contenedor.innerHTML = `<div class="loading">No se encontraron vehículos que coincidan con los filtros seleccionados.</div>`;
                return;
            }

            autos.forEach((auto) => {
                const idIndex = auto._id;
                const tarjeta = document.createElement('div');
                tarjeta.className = 'card';
                
                const fotosDelAuto = window.galeriasAutos[idIndex];
                const estaVendido = esAutoVendido(auto);
                
                let htmlCarrusel = `
                    <div class="carousel" id="carousel-${idIndex}" onclick="abrirLightbox(${idIndex})">
                        ${estaVendido ? '<div class="banner-vendido">Vendido</div>' : ''}
                        <img id="img-${idIndex}" src="${fotosDelAuto[window.indicesAutos[idIndex]]}" alt="${auto["Marca/Modelo"]}">
                `;
                
                if (fotosDelAuto.length > 1) {
                    htmlCarrusel += `
                        <button class="carousel-btn prev-btn" onclick="cambiarFoto(event, ${idIndex}, -1)">&#10094;</button>
                        <button class="carousel-btn next-btn" onclick="cambiarFoto(event, ${idIndex}, 1)">&#10095;</button>
                        <div class="contador-fotos" id="contador-${idIndex}">${window.indicesAutos[idIndex] + 1}/${fotosDelAuto.length}</div>
                    `;
                }
                htmlCarrusel += `</div>`;
                
                const botonHtml = estaVendido
                    ? `<a href="#" class="btn btn-disabled" style="margin-top: 1rem; display: block; text-align: center; font-size: 0.95rem;">No disponible</a>`
                    : `<a href="https://wa.me/56963033129?text=Hola, me interesa el ${auto["Marca/Modelo"]}" class="btn" style="margin-top: 1rem; display: block; text-align: center; font-size: 0.95rem;">Me interesa</a>`;

                tarjeta.innerHTML = `
                    ${htmlCarrusel}
                    <div class="card-body">
                        <div>
                            <span class="badge">${auto["Año"]}</span>
                            <span class="badge">${auto["Transmisión"]}</span>
                            <span class="badge">${auto["Bencina/Diesel"]}</span>
                        </div>
                        
                        <h3 style="margin-top: 0.5rem;">${auto["Marca/Modelo"]}</h3>
                        <p style="color: #666; font-size: 0.9rem; margin-top: 0.3rem;">${auto["Descripción"]} • ${auto["Kilometraje ($)"]} km</p>
                        
                        <div class="price" style="margin-top: auto;">$${auto["Precio (CLP)"]}</div>
                        
                        ${botonHtml}
                    </div>
                `;
                contenedor.appendChild(tarjeta);

                let cEl = document.getElementById(`carousel-${idIndex}`);
                let startX = 0;

                cEl.addEventListener('touchstart', (e) => {
                    startX = e.touches[0].clientX;
                    cEl.dataset.swiped = "false";
                }, {passive: true});

                cEl.addEventListener('touchmove', (e) => {
                    if (Math.abs(e.touches[0].clientX - startX) > 10) {
                        cEl.dataset.swiped = "true";
                    }
                }, {passive: true});

                cEl.addEventListener('touchend', (e) => {
                    if (cEl.dataset.swiped === "true") {
                        let diff = e.changedTouches[0].clientX - startX;
                        if (Math.abs(diff) > 35) {
                            if (diff < 0) cambiarFoto(e, idIndex, 1);
                            else cambiarFoto(e, idIndex, -1);
                        }
                    }
                });
            });
        }

        function cargarAutos() {
            Papa.parse(urlGoogleSheet, {
                download: true,
                header: true,
                complete: function(results) {
                    const datos = results.data;
                    window.todosLosAutos = [];

                    datos.forEach((auto, idIndex) => {
                        if(auto["Marca/Modelo"] && auto["Precio (CLP)"]) {
                            auto._id = idIndex;
                            
                            let fotosDelAuto = [];
                            for(let i = 1; i <= 9; i++) {
                                let fotoDrive = auto[`Foto ${i}`];
                                if (fotoDrive && fotoDrive.trim() !== "") {
                                    const match = fotoDrive.match(/[-\w]{25,}/);
                                    if (match) {
                                        fotosDelAuto.push(`https://drive.google.com/thumbnail?id=${match[0]}&sz=w1000`);
                                    }
                                }
                            }

                            if (fotosDelAuto.length === 0) {
                                fotosDelAuto.push("https://placehold.co/800x500/eeeeee/999999?text=Sin+Imagen");
                            }

                            window.galeriasAutos[idIndex] = fotosDelAuto;
                            window.indicesAutos[idIndex] = 0;
                            window.todosLosAutos.push(auto);
                        }
                    });

                    llenarDesplegables(window.todosLosAutos);
                    renderizarAutos(window.todosLosAutos);
                }
            });
        }

        cargarAutos();
    </script>
</body>
</html>
